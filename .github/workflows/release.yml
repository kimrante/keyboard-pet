# 릴리스: Actions 탭에서 수동 실행(workflow_dispatch)한다.
# Windows 러너에서 테스트 → scripts/publish.ps1 -All(단일 exe + 포터블 zip) → 태그 v<버전> 생성 → 릴리스 게시·파일 업로드.
# 버전은 src/KeyboardPet.App/KeyboardPet.App.csproj 의 <Version>, 릴리스 노트는 docs/release-notes/v<버전>.md 를 쓴다.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "초안(draft)으로 만들기"
        type: boolean
        default: false
      reupload:
        description: "이미 있는 릴리스에 파일만 다시 올리기(첨부가 누락된 경우)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 버전·태그 확인
        id: version
        run: |
          $project = "src/KeyboardPet.App/KeyboardPet.App.csproj"
          $version = (Select-String -Path $project -Pattern '<Version>(.+?)</Version>' -Encoding UTF8 | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw "csproj에서 <Version>을 찾지 못했습니다." }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists -and "${{ inputs.reupload }}" -ne "true") { throw "릴리스 $tag 이(가) 이미 있습니다. csproj의 <Version>을 올린 뒤 다시 실행하거나, 파일만 다시 올리려면 reupload를 켜세요." }
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "릴리스 노트 $notes 이(가) 없습니다." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: 테스트
        run: dotnet test tests/KeyboardPet.Core.Tests -c Release

      - name: 게시 (단일 exe + 포터블 zip)
        run: ./scripts/publish.ps1 -All

      - name: 릴리스 노트에 파일 표 추가
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = @(
            @{ Path = "artifacts/win-x64/KeyboardPet.exe"; Use = "단일 실행 파일 (자체 포함)" },
            @{ Path = "artifacts/KeyboardPet-$version-win-x64-portable.zip"; Use = "포터블 폴더 (자체 포함, 임시 폴더 추출 없음)" }
          )
          $table = @("", "### 파일", "| 파일 | 용도 | 크기 | SHA-256 |", "|------|------|------|---------|")
          foreach ($f in $files) {
            $item = Get-Item $f.Path
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $table += "| {0} | {1} | {2:N0} MB | ``{3}`` |" -f $item.Name, $f.Use, ($item.Length / 1MB), $hash
          }
          $body = (Get-Content "${{ steps.version.outputs.notes }}" -Raw -Encoding UTF8).TrimEnd() + "`n" + ($table -join "`n") + "`n"
          Set-Content -Path release-notes.md -Value $body -Encoding UTF8 -NoNewline

      - name: 태그 생성·릴리스 게시
        if: steps.version.outputs.exists != 'true'
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $draft = if ("${{ inputs.draft }}" -eq "true") { @("--draft") } else { @() }
          # 파일은 다음 단계에서 따로 올리고 개수를 확인한다(create에 파일을 함께 주면 누락돼도 성공으로 끝난 사례가 있음).
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Keyboard Pet $tag" `
            --notes-file release-notes.md `
            @draft
          if ($LASTEXITCODE -ne 0) { throw "gh release create 실패 ($LASTEXITCODE)" }

      - name: 파일 업로드·확인
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $files = @(
            "artifacts/win-x64/KeyboardPet.exe#KeyboardPet.exe (단일 실행 파일, Windows x64)",
            "artifacts/KeyboardPet-$version-win-x64-portable.zip#KeyboardPet-$version-win-x64-portable.zip (포터블, 임시 폴더 추출 없음)"
          )
          if ("${{ steps.version.outputs.exists }}" -eq "true") {
            # 파일만 다시 올리는 경우: 노트의 파일 표(크기·해시)도 이번 빌드 기준으로 맞춘다.
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit 실패 ($LASTEXITCODE)" }
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber @files
            $uploaded = (gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '[.assets[] | select(.state == "uploaded")] | length')
            Write-Host "시도 $attempt : 업로드된 파일 $uploaded 개"
            if ($uploaded -eq $files.Count) { break }
            Start-Sleep -Seconds 10
          }
          if ($uploaded -ne $files.Count) { throw "첨부 파일이 $($files.Count)개여야 하는데 $uploaded 개입니다." }
