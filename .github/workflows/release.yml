# 릴리스: Actions 탭에서 수동 실행(workflow_dispatch)한다.
# Windows 러너에서 테스트 → scripts/publish.ps1 -All(단일 exe + 포터블 zip) → 태그 v<버전> 생성 → 릴리스 게시·파일 업로드.
# 버전은 src/KeyboardPet.App/KeyboardPet.App.csproj 의 <Version>, 릴리스 노트는 docs/release-notes/v<버전>.md 를 쓴다.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "초안(draft)으로 만들기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 버전·태그 확인
        id: version
        run: |
          $project = "src/KeyboardPet.App/KeyboardPet.App.csproj"
          $version = (Select-String -Path $project -Pattern '<Version>(.+?)</Version>' -Encoding UTF8 | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw "csproj에서 <Version>을 찾지 못했습니다." }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "릴리스 $tag 이(가) 이미 있습니다. csproj의 <Version>을 올린 뒤 다시 실행하세요." }
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "릴리스 노트 $notes 이(가) 없습니다." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: 테스트
        run: dotnet test tests/KeyboardPet.Core.Tests -c Release

      - name: 게시 (단일 exe + 포터블 zip)
        run: ./scripts/publish.ps1 -All

      - name: 릴리스 노트에 파일 표 추가
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = @(
            @{ Path = "artifacts/win-x64/KeyboardPet.exe"; Use = "단일 실행 파일 (자체 포함)" },
            @{ Path = "artifacts/KeyboardPet-$version-win-x64-portable.zip"; Use = "포터블 폴더 (자체 포함, 임시 폴더 추출 없음)" }
          )
          $table = @("", "### 파일", "| 파일 | 용도 | 크기 | SHA-256 |", "|------|------|------|---------|")
          foreach ($f in $files) {
            $item = Get-Item $f.Path
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $table += "| {0} | {1} | {2:N0} MB | ``{3}`` |" -f $item.Name, $f.Use, ($item.Length / 1MB), $hash
          }
          $body = (Get-Content "${{ steps.version.outputs.notes }}" -Raw -Encoding UTF8).TrimEnd() + "`n" + ($table -join "`n") + "`n"
          Set-Content -Path release-notes.md -Value $body -Encoding UTF8 -NoNewline

      - name: 태그 생성·릴리스 게시
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $draft = if ("${{ inputs.draft }}" -eq "true") { @("--draft") } else { @() }
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Keyboard Pet $tag" `
            --notes-file release-notes.md `
            @draft `
            "artifacts/win-x64/KeyboardPet.exe#KeyboardPet.exe (단일 실행 파일, Windows x64)" `
            "artifacts/KeyboardPet-$version-win-x64-portable.zip#KeyboardPet-$version-win-x64-portable.zip (포터블, 임시 폴더 추출 없음)"
          if ($LASTEXITCODE -ne 0) { throw "gh release create 실패 ($LASTEXITCODE)" }
